name: ingest

on:
  schedule:
    # 02:00 UTC = 08:00 Asia/Dhaka
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAGGING_MODEL: ${{ vars.TAGGING_MODEL || 'llama-3.1-8b-instant' }}
      MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '50' }}
      INGEST_USER_AGENT: ${{ vars.INGEST_USER_AGENT || 'NewsFinderBot/0.1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Unit tests
        run: pytest ingest/tests -q

      - name: Run ingest
        run: python ingest/run.py
